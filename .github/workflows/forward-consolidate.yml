# Forward a queued Atlas consolidate request to the Cursor Automation webhook.
#
# Copy to CrangoOne/listings-atlas-/.github/workflows/forward-consolidate.yml
#
# Atlas writes data/pending_consolidate.json via the GitHub Contents API (CORS-ok
# from Pages). This workflow forwards that JSON to Cursor.
#
# Secrets on listings-atlas- (same as Forward crawl wave):
#   CONSOLIDATE_WEBHOOK_URL      Cursor automation webhook URL
#   CONSOLIDATE_WEBHOOK_BEARER   Bearer token (crsr_…)
#
# You may reuse CRAWL_WAVE_* secrets by aliasing env vars below.

name: Forward consolidate request

on:
  push:
    paths:
      - data/pending_consolidate.json
  workflow_dispatch:

jobs:
  forward:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: POST consolidate request to Cursor automation
        env:
          CONSOLIDATE_URL: ${{ secrets.CONSOLIDATE_WEBHOOK_URL }}
          CONSOLIDATE_TOKEN: ${{ secrets.CONSOLIDATE_WEBHOOK_BEARER }}
          CRAWL_URL: ${{ secrets.CRAWL_WAVE_WEBHOOK_URL }}
          CRAWL_TOKEN: ${{ secrets.CRAWL_WAVE_WEBHOOK_BEARER }}
        run: |
          set -euo pipefail
          URL="${CONSOLIDATE_URL:-${CRAWL_URL:-}}"
          TOKEN="${CONSOLIDATE_TOKEN:-${CRAWL_TOKEN:-}}"
          if [ -z "${URL}" ] || [ -z "${TOKEN}" ]; then
            echo "Set CONSOLIDATE_WEBHOOK_* or CRAWL_WAVE_* repository secrets."
            exit 1
          fi
          if [ ! -f data/pending_consolidate.json ]; then
            echo "No data/pending_consolidate.json"
            exit 1
          fi
          python3 -c 'import json,pathlib; p=json.loads(pathlib.Path("data/pending_consolidate.json").read_text()); assert p.get("kind")=="listings-atlas-consolidate", p.get("kind"); print("wave_id=%s" % (p.get("wave_id") or "all-open"))'
          AUTH="$TOKEN"
          case "$AUTH" in
            Bearer\ *|bearer\ *) ;;
            *) AUTH="Bearer $TOKEN" ;;
          esac
          curl -sS -f -X POST "$URL" \
            -H "Authorization: $AUTH" \
            -H "Content-Type: application/json" \
            --data-binary @data/pending_consolidate.json
          echo
          echo "Forwarded consolidate request to Cursor automation."
