<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Levente B. — Meister &amp; Mentor (Demo D)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #1a2438;
      --navy-deep: #121925;
      --chalk: #f3f1ea;
      --crimson: #b83a3a;
      --mute: rgba(243, 241, 234, 0.68);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(900px 500px at 100% 0%, rgba(184, 58, 58, 0.12), transparent 50%),
        linear-gradient(160deg, var(--navy-deep), var(--navy));
      color: var(--chalk);
      font-family: "Figtree", system-ui, sans-serif;
    }
    a { color: inherit; text-decoration: none; }

    .demo-bar {
      position: fixed; inset: 0 0 auto; z-index: 40;
      display: flex; justify-content: space-between; gap: 0.75rem; align-items: center;
      padding: 0.55rem 1rem; font-size: 0.78rem;
      background: rgba(18, 25, 37, 0.92); border-bottom: 1px solid rgba(184, 58, 58, 0.35);
      backdrop-filter: blur(10px);
    }
    .demo-bar strong { color: #e8a0a0; }
    .demo-bar a { border: 1px solid rgba(243,241,234,0.22); padding: 0.35rem 0.7rem; border-radius: 999px; }
    .demo-bar a:hover { border-color: var(--crimson); }

    .hero {
      min-height: 100svh;
      padding: 4.5rem 1rem 2.5rem;
      display: grid;
      grid-template-columns: 1fr 1.05fr;
      gap: 2.5rem;
      align-items: center;
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    .copy { animation: rise 0.85s ease both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    .wordmark {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 650;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      margin-bottom: 2.5rem;
    }
    .wordmark span { color: var(--crimson); }
    .nav {
      display: flex; gap: 1.1rem; margin-bottom: 2.5rem;
      font-size: 0.85rem; color: var(--mute);
    }
    .nav a:hover { color: var(--chalk); }

    h1 {
      margin: 0 0 1rem;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 650;
      font-size: clamp(2.6rem, 6vw, 4.2rem);
      line-height: 1.05;
      max-width: 12ch;
    }
    .lede {
      margin: 0 0 1.6rem;
      max-width: 28rem;
      color: var(--mute);
      font-size: 1.05rem;
      line-height: 1.5;
    }
    .cta {
      display: inline-block;
      background: var(--crimson);
      color: #fff;
      font-weight: 600;
      padding: 0.95rem 1.35rem;
      border-radius: 2px;
      transition: transform 0.2s ease;
    }
    .cta:hover { transform: translateY(-2px); }

    .portrait {
      position: relative;
      animation: rise 0.95s ease 0.12s both;
    }
    .portrait::before {
      content: "";
      position: absolute;
      inset: 1.2rem -1.2rem -1.2rem 1.2rem;
      border: 1px solid rgba(243,241,234,0.18);
      z-index: 0;
    }
    .portrait img {
      position: relative; z-index: 1;
      display: block;
      width: 100%;
      max-height: 78vh;
      object-fit: cover;
      object-position: center top;
      filter: contrast(1.05) saturate(0.9);
    }
    .caption {
      position: relative; z-index: 2;
      margin-top: 0.85rem;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .caption b { color: var(--chalk); font-weight: 600; }

    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; padding-top: 4rem; gap: 1.5rem; }
      h1 { max-width: none; }
      .portrait::before { inset: 0.8rem -0.6rem -0.8rem 0.6rem; }
      .portrait img { max-height: 55vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      .copy, .portrait { animation: none; }
    }
  </style>
</head>
<body>
  <div class="demo-bar">
    <span><strong>Demo D · Meister &amp; Mentor</strong> — Konzept-Homepage</span>
    <span>
      <a href="../">Alle</a>
      <a href="../a/">A</a>
      <a href="../b/">B</a>
      <a href="../c/">C</a>
      <a href="../e/">E</a>
    </span>
  </div>

  <header class="hero">
    <div class="copy">
      <div class="wordmark">Levente B.<span> · Wien</span></div>
      <nav class="nav" aria-label="Hauptnavigation">
        <a href="#bio">Bio</a>
        <a href="../news/?demo=d">News</a>
        <a href="mailto:trainwith@b-levente.at">Kontakt</a>
      </nav>
      <h1>Persönlich. Auf Weltniveau.</h1>
      <p class="lede" id="bio">Ruhige Kraft — Champion und Mentor. Training, das Charakter formt, nicht nur Kondition misst.</p>
      <a class="cta" href="mailto:trainwith@b-levente.at">Erste Einheit</a>
    </div>
    <figure class="portrait">
      <img src="../assets/hero-group.jpg" alt="Levente Bertalan im Training" />
      <figcaption class="caption" id="news"><b>4. Dan</b> · Uni Wien · Ehrenzeichen</figcaption>
    </figure>
  </header>
</body>
</html>
