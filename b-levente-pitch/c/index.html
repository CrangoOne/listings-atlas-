<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Levente B. — 196 Gold (Demo C)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --demo-accent: #d4b35a;
      --bg: #050505;
      --paper: #f7f7f5;
      --gold: #d4b35a;
      --mute: rgba(247, 247, 245, 0.65);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--paper); font-family: "IBM Plex Sans", system-ui, sans-serif; }
    a { color: inherit; text-decoration: none; }

    .demo-bar {
          position: fixed; top: 0; left: 0; right: 0; z-index: 40;
          display: flex;
          flex-direction: column;
          align-items: stretch;
          gap: 0.45rem;
          padding: 0.55rem 0.85rem calc(0.55rem + env(safe-area-inset-top, 0px));
          padding-top: calc(0.55rem + env(safe-area-inset-top, 0px));
          background: rgba(12, 12, 14, 0.94);
          border-bottom: 1px solid color-mix(in srgb, var(--demo-accent) 45%, transparent);
          backdrop-filter: blur(10px);
          font-size: 0.75rem;
          font-family: system-ui, sans-serif;
        }
        .demo-bar-label { line-height: 1.3; color: rgba(242,239,232,0.85); }
        .demo-bar-label strong { color: var(--demo-accent, #c9a14a); font-weight: 600; }
        .demo-bar-links {
          display: flex;
          flex-wrap: wrap;
          gap: 0.4rem;
          align-items: center;
        }
        .demo-bar-links a {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          min-width: 2rem;
          min-height: 2rem;
          padding: 0.3rem 0.65rem;
          border: 1px solid rgba(244, 240, 230, 0.28);
          border-radius: 999px;
          line-height: 1;
          white-space: nowrap;
          -webkit-tap-highlight-color: transparent;
        }
        .demo-bar-links a:hover,
        .demo-bar-links a[aria-current="page"] {
          border-color: var(--demo-accent, #c9a14a);
          color: var(--demo-accent, #c9a14a);
        }
        @media (min-width: 720px) {
          .demo-bar {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.55rem 1rem;
          }
        }

    .hero, .frame, .stack { scroll-margin-top: 5.5rem; }
    @media (max-width: 719px) {
      .hero { padding-top: 6.25rem !important; }
      .hero-media, .bg, .media { top: 5.75rem !important; }
    }

    .hero {
      position: relative;
      min-height: 100svh;
      padding: 3.2rem 1rem 2rem;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 1rem;
      align-items: end;
    }
    .num {
      position: absolute;
      left: -4vw; top: 8vh;
      font-family: "Anton", sans-serif;
      font-size: clamp(10rem, 42vw, 28rem);
      line-height: 0.8;
      color: transparent;
      -webkit-text-stroke: 2px rgba(212, 179, 90, 0.55);
      letter-spacing: -0.04em;
      user-select: none;
      animation: num-in 1s ease both;
      pointer-events: none;
    }
    @keyframes num-in {
      from { opacity: 0; transform: translateY(4vh); }
      to { opacity: 1; transform: none; }
    }

    .copy {
      position: relative; z-index: 2;
      padding-bottom: 4vh;
      animation: rise 0.8s ease 0.15s both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    .nav {
      display: flex; gap: 1rem; margin-bottom: 18vh;
      font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute);
    }
    .nav a:hover { color: var(--gold); }
    h1 {
      margin: 0;
      font-family: "Anton", sans-serif;
      font-size: clamp(3rem, 9vw, 5.5rem);
      letter-spacing: 0.02em;
      line-height: 0.95;
    }
    .goldline {
      margin: 0.85rem 0 1.2rem;
      font-family: "Anton", sans-serif;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      color: var(--gold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .lede { margin: 0 0 1.5rem; max-width: 26rem; color: var(--mute); line-height: 1.45; }
    .cta {
      display: inline-block;
      background: var(--gold); color: #111; font-weight: 600;
      padding: 0.95rem 1.3rem; border-radius: 2px;
      transition: transform 0.2s ease;
    }
    .cta:hover { transform: translateY(-2px); }

    .shot {
      position: relative; z-index: 2;
      justify-self: end;
      width: min(100%, 420px);
      aspect-ratio: 4/5;
      overflow: hidden;
      border: 1px solid rgba(212,179,90,0.35);
      animation: rise 0.9s ease 0.25s both;
    }
    .shot img {
      width: 100%; height: 100%; object-fit: cover; object-position: center top;
      filter: contrast(1.15) grayscale(0.15);
      transition: transform 8s ease;
    }
    .shot:hover img { transform: scale(1.06); }
    .shot figcaption {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 0.7rem 0.85rem;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold);
    }

    @media (max-width: 820px) {
      .hero { grid-template-columns: 1fr; align-items: start; }
      .nav { margin-bottom: 8vh; }
      .num { top: 4vh; font-size: clamp(8rem, 50vw, 16rem); opacity: 0.7; }
      .shot { width: min(100%, 360px); justify-self: start; }
    }
    @media (prefers-reduced-motion: reduce) {
      .num, .copy, .shot { animation: none; }
      .shot img { transition: none; }
    }
  </style>
</head>
<body>
    <div class="demo-bar">
    <div class="demo-bar-label"><strong>Demo C · 196 Gold</strong> — Konzept-Homepage</div>
    <nav class="demo-bar-links" aria-label="Demo wechseln">
      <a href="../">Alle</a>
      <a href="../a/">A</a>
      <a href="../b/">B</a>
      <a href="./" aria-current="page">C</a>
      <a href="../d/">D</a>
      <a href="../e/">E</a>
    </nav>
  </div>

  <header class="hero">
    <div class="num" aria-hidden="true">196</div>
    <div class="copy">
      <nav class="nav" aria-label="Hauptnavigation">
        <a href="./">Levente</a>
        <a href="#bio">Bio</a>
        <a href="../news/?demo=c">News</a>
        <a href="mailto:trainwith@b-levente.at">Kontakt</a>
      </nav>
      <h1>LEVENTE</h1>
      <p class="goldline">Gold. Europa. Welt.</p>
      <p class="lede" id="bio">Die Zahl ist die Marke. Rekordhalter-Energie — Personal Training mit dem Champion, der die Medaillenwand füllt.</p>
      <a class="cta" href="mailto:trainwith@b-levente.at">Mit dem Champion trainieren</a>
    </div>
    <figure class="shot">
      <img src="../assets/hero-kick.png" alt="Levente Bertalan beim Kick" />
      <figcaption id="news">~196× Gold · WAKO PRO</figcaption>
    </figure>
  </header>
</body>
</html>
